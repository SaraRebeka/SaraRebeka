<svg xmlns="http://www.w3.org/2000/svg" width="860" height="90" viewBox="0 0 860 90" role="img" aria-label="© MULTIVERSAL VOID COMPANY · FIM DA TRANSMISSÃO · FEITO NO BRASIL">
<title>© MULTIVERSAL VOID COMPANY · FIM DA TRANSMISSÃO · FEITO NO BRASIL</title>
<style>
@font-face{font-family:'Orbitron';font-weight:400 900;src:url(data:font/woff2;base64,) format('woff2');}
.f{font-family:'Orbitron';font-size:11px;fill:#666;letter-spacing:3px;text-anchor:middle}
.dot{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.2}50%{opacity:1}}
.tw{animation:tw 4s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.15}50%{opacity:1}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<defs>
  <radialGradient id="void" cx="50%" cy="50%" r="75%">
    <stop offset="0" stop-color="#1a0420"/><stop offset=".45" stop-color="#0f0f0f"/>
    <stop offset="1" stop-color="#000"/>
  </radialGradient>
  <filter id="glow" x="-30%" y="-60%" width="160%" height="220%">
    <feGaussianBlur stdDeviation="3" result="a"/>
    <feGaussianBlur stdDeviation="9" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="a"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="soft" x="-20%" y="-50%" width="140%" height="200%">
    <feGaussianBlur stdDeviation="2.2" result="a"/>
    <feMerge><feMergeNode in="a"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
    <rect width="4" height="1" fill="#fff" opacity=".025"/>
  </pattern></defs>
<rect width="860" height="90" rx="14" fill="url(#void)"/><rect width="860" height="90" rx="14" fill="url(#scan)"/>
  <line x1="40" y1="24" x2="820" y2="24" stroke="#e100ff" stroke-opacity=".4"/>
  <circle cx="400" cy="24" r="3" fill="#ff52ff" class="dot"/><circle cx="430" cy="24" r="3" fill="#ff52ff" class="dot" style="animation-delay:.3s"/><circle cx="460" cy="24" r="3" fill="#ff52ff" class="dot" style="animation-delay:.6s"/>
  <text x="430" y="62" class="f">© MULTIVERSAL VOID COMPANY · FIM DA TRANSMISSÃO · FEITO NO BRASIL</text>
</svg>
