name: Atualiza gráfico de atividade

on:
  schedule:
    - cron: "17 6 * * *"   # todo dia, 03:17 no horário de Brasília
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - assets/contrib.py
      - assets/build.py
      - .github/workflows/atividade.yml

permissions:
  contents: write

jobs:
  atividade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install fonttools brotli
      - run: python assets/contrib.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Salva se mudou
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/svg/atividade.svg
          git diff --cached --quiet || (git commit -m "Atualiza gráfico de atividade" && git push)
