<svg xmlns="http://www.w3.org/2000/svg" width="430" height="192" viewBox="0 0 430 192" role="img" aria-label="LINKEDIN">
<title>LINKEDIN</title>
<style>
@font-face{font-family:'Orbitron';font-weight:400 900;src:url(data:font/woff2;base64,) format('woff2');}
.b{fill:#000;stroke:#e100ff;stroke-width:2;animation:glow 2.6s ease-in-out infinite}
.l{font-family:'Orbitron';font-weight:600;font-size:15px;fill:#e100ff;letter-spacing:3px;text-anchor:middle}
.f{font-family:'Orbitron';font-size:10px;fill:#666;letter-spacing:3px}
@keyframes glow{0%,100%{stroke-opacity:.6}50%{stroke-opacity:.9}}

.tw{animation:tw 4s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.15}50%{opacity:1}}
.t-h{font-family:'Orbitron';font-weight:700;fill:#fff}
.t-sec{font-family:'Orbitron';font-weight:700;font-size:26px;fill:#fff;letter-spacing:6px;text-anchor:middle}
.t-num{font-family:'Orbitron';font-size:12px;fill:#ff52ff;letter-spacing:3px;text-anchor:middle}
.t-small{font-family:'Orbitron';font-size:10px;fill:#777;letter-spacing:3px}
.bar{stroke:#e100ff;stroke-width:2;stroke-dasharray:420;stroke-dashoffset:420;animation:draw 1.6s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<defs>
  <radialGradient id="cardbg" cx="30%" cy="20%" r="90%">
    <stop offset="0" stop-color="#1c0622"/><stop offset="1" stop-color="#0a070d"/>
  </radialGradient>
  <filter id="glow" x="-30%" y="-60%" width="160%" height="220%">
    <feGaussianBlur stdDeviation="2" result="a"/>
    <feGaussianBlur stdDeviation="7" result="b0"/>
    <feComponentTransfer in="b0" result="b"><feFuncA type="linear" slope=".45"/></feComponentTransfer>
    <feComponentTransfer in="a" result="a2"><feFuncA type="linear" slope=".6"/></feComponentTransfer>
    <feMerge><feMergeNode in="b"/><feMergeNode in="a2"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="soft" x="-20%" y="-50%" width="140%" height="200%">
    <feGaussianBlur stdDeviation="1.6" result="a0"/>
    <feComponentTransfer in="a0" result="a"><feFuncA type="linear" slope=".55"/></feComponentTransfer>
    <feMerge><feMergeNode in="a"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
    <rect width="4" height="1" fill="#fff" opacity=".022"/>
  </pattern></defs>
<rect x="1" y="-39" width="468" height="230" rx="22" fill="#08060c"/><rect x="1" y="-39" width="468" height="230" rx="22" fill="url(#scan)"/><rect x="1" y="-39" width="468" height="230" rx="22" fill="none" stroke="#e100ff" stroke-opacity=".45" stroke-width="1.5" filter="url(#soft)"/>
  <circle cx="415.3" cy="107.5" r="1.3" fill="#f3c6ff" class="tw" style="animation-delay:3.07s;animation-duration:5.47s"/>
  <circle cx="180.8" cy="44.3" r="1" fill="#fff" class="tw" style="animation-delay:1.35s;animation-duration:3.27s"/>
  <circle cx="246.7" cy="4.3" r="0.8" fill="#fff" class="tw" style="animation-delay:3.72s;animation-duration:4.17s"/>
  <circle cx="165.4" cy="5.8" r="0.8" fill="#ff52ff" class="tw" style="animation-delay:3.61s;animation-duration:3.06s"/>
  <circle cx="264.4" cy="107.3" r="1.3" fill="#fff" class="tw" style="animation-delay:2.85s;animation-duration:2.88s"/>
  <circle cx="288.4" cy="12.2" r="0.8" fill="#fff" class="tw" style="animation-delay:0.76s;animation-duration:2.91s"/>
  <circle cx="213.6" cy="122.9" r="0.6" fill="#fff" class="tw" style="animation-delay:2.33s;animation-duration:2.50s"/>
  <circle cx="244.2" cy="0.2" r="0.6" fill="#ff52ff" class="tw" style="animation-delay:1.54s;animation-duration:3.58s"/>
  <circle cx="341.0" cy="37.2" r="1.3" fill="#ff52ff" class="tw" style="animation-delay:2.74s;animation-duration:4.55s"/>
  <circle cx="91.1" cy="66.0" r="1.3" fill="#fff" class="tw" style="animation-delay:0.04s;animation-duration:3.41s"/>
  <circle cx="250.6" cy="88.5" r="0.8" fill="#fff" class="tw" style="animation-delay:2.42s;animation-duration:3.38s"/>
  <circle cx="218.5" cy="148.2" r="0.6" fill="#fff" class="tw" style="animation-delay:3.70s;animation-duration:5.06s"/>
  <circle cx="360.6" cy="115.9" r="1.3" fill="#fff" class="tw" style="animation-delay:2.87s;animation-duration:4.04s"/>
  <circle cx="274.3" cy="103.4" r="0.8" fill="#fff" class="tw" style="animation-delay:2.62s;animation-duration:4.51s"/>
  <rect x="150" y="16" width="260" height="54" rx="8" class="b" filter="url(#soft)"/>
  <text x="280.0" y="49.0" class="l" filter="url(#soft)">LINKEDIN</text>
  <line x1="40" y1="118" x2="430" y2="118" stroke="#e100ff" stroke-opacity=".35"/>
  <text x="416" y="152" class="f" text-anchor="end">© MULTIVERSAL VOID COMPANY</text>
</svg>
