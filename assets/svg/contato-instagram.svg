<svg xmlns="http://www.w3.org/2000/svg" width="430" height="192" viewBox="0 0 430 192" role="img" aria-label="INSTAGRAM">
<title>INSTAGRAM</title>
<style>
@font-face{font-family:'Orbitron';font-weight:400 900;src:url(data:font/woff2;base64,) format('woff2');}
.b{fill:#000;stroke:#e100ff;stroke-width:2;animation:glow 2.6s ease-in-out infinite}
.l{font-family:'Orbitron';font-weight:600;font-size:15px;fill:#e100ff;letter-spacing:3px;text-anchor:middle}
.f{font-family:'Orbitron';font-size:10px;fill:#666;letter-spacing:3px}
@keyframes glow{0%,100%{stroke-opacity:.85}50%{stroke-opacity:1}}

.tw{animation:tw 4s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.15}50%{opacity:1}}
.t-h{font-family:'Orbitron';font-weight:700;fill:#fff}
.t-sec{font-family:'Orbitron';font-weight:700;font-size:26px;fill:#fff;letter-spacing:6px;text-anchor:middle}
.t-num{font-family:'Orbitron';font-size:12px;fill:#ff52ff;letter-spacing:3px;text-anchor:middle}
.t-small{font-family:'Orbitron';font-size:10px;fill:#777;letter-spacing:3px}
.bar{stroke:#e100ff;stroke-width:2;stroke-dasharray:420;stroke-dashoffset:420;animation:draw 1.6s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<defs>
  <radialGradient id="cardbg" cx="30%" cy="20%" r="90%">
    <stop offset="0" stop-color="#1c0622"/><stop offset="1" stop-color="#0a070d"/>
  </radialGradient>
  <filter id="glow" x="-30%" y="-60%" width="160%" height="220%">
    <feGaussianBlur stdDeviation="2" result="a"/>
    <feGaussianBlur stdDeviation="7" result="b0"/>
    <feComponentTransfer in="b0" result="b"><feFuncA type="linear" slope=".45"/></feComponentTransfer>
    <feComponentTransfer in="a" result="a2"><feFuncA type="linear" slope=".6"/></feComponentTransfer>
    <feMerge><feMergeNode in="b"/><feMergeNode in="a2"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="soft" x="-20%" y="-50%" width="140%" height="200%">
    <feGaussianBlur stdDeviation="1.6" result="a0"/>
    <feComponentTransfer in="a0" result="a"><feFuncA type="linear" slope=".55"/></feComponentTransfer>
    <feMerge><feMergeNode in="a"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
    <rect width="4" height="1" fill="#fff" opacity=".022"/>
  </pattern></defs>
<rect x="-39" y="-39" width="468" height="230" rx="22" fill="#08060c"/><rect x="-39" y="-39" width="468" height="230" rx="22" fill="url(#scan)"/><rect x="-39" y="-39" width="468" height="230" rx="22" fill="none" stroke="#e100ff" stroke-opacity=".45" stroke-width="1.5" filter="url(#soft)"/>
  <circle cx="191.4" cy="56.5" r="1" fill="#ff52ff" class="tw" style="animation-delay:2.64s;animation-duration:3.66s"/>
  <circle cx="33.8" cy="126.6" r="1" fill="#fff" class="tw" style="animation-delay:3.31s;animation-duration:3.42s"/>
  <circle cx="320.9" cy="11.5" r="0.8" fill="#f3c6ff" class="tw" style="animation-delay:0.94s;animation-duration:4.30s"/>
  <circle cx="13.0" cy="6.4" r="0.8" fill="#fff" class="tw" style="animation-delay:3.05s;animation-duration:4.17s"/>
  <circle cx="185.5" cy="69.3" r="0.8" fill="#fff" class="tw" style="animation-delay:3.59s;animation-duration:2.61s"/>
  <circle cx="146.8" cy="63.3" r="0.6" fill="#fff" class="tw" style="animation-delay:2.31s;animation-duration:5.33s"/>
  <circle cx="263.0" cy="178.1" r="1.3" fill="#ff52ff" class="tw" style="animation-delay:0.20s;animation-duration:2.68s"/>
  <circle cx="22.3" cy="81.1" r="1" fill="#fff" class="tw" style="animation-delay:0.80s;animation-duration:3.18s"/>
  <circle cx="416.0" cy="158.2" r="1.3" fill="#fff" class="tw" style="animation-delay:2.97s;animation-duration:5.38s"/>
  <circle cx="18.2" cy="70.2" r="1.3" fill="#f3c6ff" class="tw" style="animation-delay:2.72s;animation-duration:2.96s"/>
  <circle cx="205.0" cy="177.3" r="1.3" fill="#fff" class="tw" style="animation-delay:3.21s;animation-duration:2.89s"/>
  <circle cx="132.2" cy="94.7" r="0.6" fill="#fff" class="tw" style="animation-delay:1.66s;animation-duration:3.04s"/>
  <circle cx="170.2" cy="56.3" r="1" fill="#fff" class="tw" style="animation-delay:2.36s;animation-duration:3.93s"/>
  <circle cx="95.6" cy="149.3" r="0.6" fill="#ff52ff" class="tw" style="animation-delay:1.89s;animation-duration:2.69s"/>
  <rect x="20" y="16" width="260" height="54" rx="8" class="b" filter="url(#soft)"/>
  <text x="150.0" y="49.0" class="l" filter="url(#soft)">INSTAGRAM</text>
  <line x1="0" y1="118" x2="390" y2="118" stroke="#e100ff" stroke-opacity=".35"/>
  <text x="14" y="152" class="f" text-anchor="start">FIM DA TRANSMISSÃO · FEITO NO BRASIL</text>
</svg>
